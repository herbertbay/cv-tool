<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Motivation Letter - {{ full_name }}</title>
  <style>
    @page { size: A4; margin: 2cm; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 11pt;
      line-height: 1.5;
      color: #1a1a1a;
      max-width: 21cm;
      margin: 0 auto;
    }
    .letter-text { text-align: justify; }
    .powered-by { font-size: 8pt; color: #94a3b8; margin-top: 1.5em; padding-top: 0.5em; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="letter-text">{{ motivation_letter|safe }}</div>
  {% if show_powered_by %}
  <p class="powered-by">Powered by Optimal.cv</p>
  {% endif %}
</body>
</html>
